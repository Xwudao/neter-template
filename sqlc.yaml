version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/query"
    gen:
      go:
        package: "sqlc"
        out: "internal/data/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_result_struct_pointers: true
        emit_interface: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
