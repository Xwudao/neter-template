app:
  mode: debug
  port: 8080
  pprof: false
  host: true
cors:
  allowCredentials: true
  allowOrigin:
    - localhost
    - 127.0.0.1
  maxAge: 24h
db:
  database: neter
  host: 127.0.0.1
  username: postgres
  password: postgres
  port: 5432
  # Apply pending db/migrations when the binary starts. Set false to run
  # migrations as a separate step (e.g. `./app migrate up --all` or a k8s Job).
  autoMigrate: true
  # Optional: dedicated DDL user for migrations.
  # migrateDsn: postgres://migrator:secret@127.0.0.1:5432/neter?sslmode=disable
  # Optional: read migrations from disk instead of the embedded copy.
  # migratePath: db/migrations
jwt:
  secret: thisstringmustbeverylongandrandom
  expire: 24h
  issuer: neter
log:
  format: text
  level: debug
  linkName: current.log
  path: ./logs

redis:
  addr: 127.0.0.1:6379
  db: 0
  password: ""
  prefix: ""
